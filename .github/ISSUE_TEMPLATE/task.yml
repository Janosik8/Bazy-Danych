name: "📋 Zadanie projektowe"
description: "Szablon zadania do projektu budżetu domowego"
title: "[TASK]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        ## Zadanie projektowe
        Wypełnij poniższe pola. Pamiętaj że issues są czytane przez agenta AI - bądź precyzyjny.

  - type: textarea
    id: description
    attributes:
      label: "📝 Opis zadania"
      description: "Co dokładnie trzeba zrobić? Opisz precyzyjnie, tak żeby agent AI mógł to zrealizować."
      placeholder: "Opisz zadanie..."
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "✅ Kryteria akceptacji"
      description: "Lista warunków, które muszą być spełnione żeby zadanie było uznane za ukończone."
      placeholder: |
        - [ ] Kryterium 1
        - [ ] Kryterium 2
      value: |
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: files
    attributes:
      label: "📁 Pliki do utworzenia/zmodyfikowania"
      description: "Ścieżki plików które trzeba utworzyć lub zmienić."
      placeholder: |
        - `sql/migrations/001_create_schema.sql` (nowy)
        - `docs/requirements.md` (modyfikacja)
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: "🔗 Kontekst i zależności"
      description: "Od jakich issues zależy to zadanie? Jaki dodatkowy kontekst jest potrzebny?"
      placeholder: "Zależy od #1, #2. Patrz docs/requirements.md"
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: "📊 Faza projektu"
      options:
        - "0 - Setup"
        - "1 - Analiza i projektowanie"
        - "2 - Implementacja schematu"
        - "3 - Widoki i zapytania"
        - "4 - Funkcje, wyzwalacze, procedury"
        - "5 - Bezpieczeństwo i transakcje"
        - "6 - Frontend"
        - "7 - Dokumentacja końcowa"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Priorytet"
      options:
        - "🔴 Wysoki - blokuje innych"
        - "🟡 Średni - ważne ale nie blokuje"
        - "🟢 Niski - można zrobić później"
    validations:
      required: true
